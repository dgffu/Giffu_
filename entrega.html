<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Giffú Entrega</title>
  <meta name="description" content="Plataforma de entrega de projetos audiovisuais e fotos de alta resolução.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%23FF5400'/><polygon points='38,30 72,50 38,70' fill='white'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #09090b;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #fff;
    }
    #appFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #09090b;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
    }
    #loadingOverlay {
      position: fixed;
      inset: 0;
      background: #09090b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      z-index: 20;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #loadingOverlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #FF5400;
      color: #fff;
      font-weight: 700;
      font-size: 18px;
      padding: 8px 16px;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(255, 84, 0, 0.35);
      letter-spacing: -0.3px;
    }
    .brand-sub {
      opacity: 0.85;
      font-weight: 400;
      font-size: 14px;
    }
    .spinner-ring {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #FF5400;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-hint {
      color: #8e8e93;
      font-size: 13px;
      margin-top: 6px;
      text-align: center;
      max-width: 280px;
      line-height: 1.4;
    }
    .btn-direct-link {
      margin-top: 10px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #aaa;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-direct-link:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <div id="loadingOverlay">
    <div class="brand-badge">
      <span>Giffú</span>
      <span class="brand-sub">Entrega</span>
    </div>
    <div class="spinner-ring"></div>
    <div class="loading-hint" id="loadingHint">Carregando painel de entrega...</div>
    <a id="btnDirect" class="btn-direct-link" href="https://giffu-entrega.onrender.com" target="_blank" rel="noopener">Abrir direto no Render ↗</a>
  </div>

  <iframe
    id="appFrame"
    title="Giffú Entrega"
    allow="clipboard-write; fullscreen; camera; microphone; encrypted-media"
    sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-presentation allow-same-origin allow-scripts allow-downloads"
  ></iframe>

  <script>
    (function () {
      const RENDER_BASE = 'https://giffu-entrega.onrender.com';
      const frame = document.getElementById('appFrame');
      const overlay = document.getElementById('loadingOverlay');
      const directBtn = document.getElementById('btnDirect');
      const hint = document.getElementById('loadingHint');

      // 1. Determina a rota interna com base nos parâmetros (?p=slug) ou no pathname
      const urlParams = new URLSearchParams(window.location.search);
      let targetPath = '';

      if (urlParams.has('p')) {
        const slug = urlParams.get('p');
        targetPath = slug ? ('/entrega/' + encodeURIComponent(slug)) : '/';
      } else {
        const pathname = window.location.pathname;
        if (pathname.startsWith('/entrega/')) {
          const sub = pathname.replace(/^\/entrega\//, '').replace(/\/+$/, '');
          if (sub && sub !== 'entrega' && sub !== 'entrega.html') {
            targetPath = '/entrega/' + sub;
          }
        }
      }

      const destinationUrl = RENDER_BASE + targetPath + window.location.hash;
      directBtn.href = destinationUrl;

      // 2. Limpa o ?p= da barra para manter a URL limpa (ex: giffu.com.br/entrega/slug)
      if (urlParams.has('p')) {
        const cleanSlug = urlParams.get('p');
        if (cleanSlug) {
          try {
            window.history.replaceState(null, '', '/entrega/' + cleanSlug + window.location.hash);
          } catch (e) {}
        }
      }

      // 3. Informa o usuário caso o Render esteja em cold start (free tier)
      const slowTimer = setTimeout(() => {
        hint.textContent = 'Iniciando servidor na nuvem (isso pode levar alguns segundos)...';
      }, 4000);

      // 4. Carrega o frame
      frame.src = destinationUrl;

      frame.addEventListener('load', () => {
        clearTimeout(slowTimer);
        setTimeout(() => {
          overlay.classList.add('hidden');
        }, 300);
      });

      // 5. Suporte a sincronização de mensagens do app interno
      window.addEventListener('message', (event) => {
        if (event.origin !== RENDER_BASE) return;
        if (event.data && event.data.type === 'giffu-title' && event.data.title) {
          document.title = event.data.title;
        }
      });
    })();
  </script>
</body>
</html>
